<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide Timeline Memo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="tab-container">
        <button id="tab-log" class="tab active" onclick="switchView('log')">
          実績 (Log)
        </button>
        <button id="tab-plan" class="tab" onclick="switchView('plan')">
          予定 (Plan)
        </button>
        <!-- ↓ここを追加（設定ボタン） -->
        <button class="tab-settings" onclick="toggleSettings()">⚙️</button>
      </div>

      <!-- ↓ここを追加（設定メニュー本体：初期状態は隠れています） -->
      <div id="settings-menu" class="hidden">
        <button onclick="exportData()">保存(書き出し)</button>
        <label class="file-label">
          復元(読み込み)
          <input
            type="file"
            id="import-file"
            onchange="importData(event)"
            accept=".json"
            style="display: none"
          />
        </label>
      </div>
    </header>

    <main id="view-viewport">
      <div id="view-slider" class="show-log">
        <section class="timeline-view" id="log-view">
          <div class="timeline-content"></div>
        </section>

        <section class="timeline-view" id="plan-view">
          <div class="timeline-content"></div>
        </section>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
